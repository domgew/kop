name: Test
on:
  push:
    branches:
      - "main"
    paths:
      - "kop/**"
      - "gradle.properties"
      - "gradle/wrapper/**"
      - "gradle/libs.versions.toml"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "kop/**"
      - "gradle.properties"
      - "gradle/wrapper/**"
      - "gradle/libs.versions.toml"
      - ".github/workflows/test.yml"
jobs:
  test-mingw:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3.5.0
      # https://github.com/actions/cache/blob/main/examples.md#java---gradle
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Test on windows
        env:
          IS_CI: yes
        run: |
          .\gradlew.bat cleanTest
          .\gradlew.bat kop:smartTest

  test-nix:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3.5.0
      # https://github.com/actions/cache/blob/main/examples.md#java---gradle
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Test on ${{ matrix.os }}
        env:
          IS_CI: yes
        run: |
          ./gradlew cleanTest
          ./gradlew kop:smartTest
      - name: Test reports on ${{ matrix.os }}
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-${{ github.sha }}-${{ matrix.os }}
          path: |
            kop/build/test-results/
            kop/build/reports/tests/
          overwrite: true
